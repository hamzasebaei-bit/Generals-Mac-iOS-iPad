name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix Submodule SSH URLs & Sync
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Host Build Tools
        run: |
          brew update
          brew install cmake ninja meson pkgconf autoconf autoconf-archive automake libtool gperf

      - name: Setup vcpkg Environment
        run: |
          if [ ! -d "$HOME/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          fi
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV

      - name: Fetch MoltenVK and Stage Fonts
        run: |
          if [ -f "./scripts/build/ios/fetch-moltenvk.sh" ]; then
            chmod +x ./scripts/build/ios/fetch-moltenvk.sh
            ./scripts/build/ios/fetch-moltenvk.sh
          fi
          if [ -f "./scripts/build/ios/stage-fonts.sh" ]; then
            chmod +x ./scripts/build/ios/stage-fonts.sh
            ./scripts/build/ios/stage-fonts.sh
          fi

      - name: Configure CMake for iOS
        run: |
          if cmake --list-presets 2>/dev/null | grep -q "ios-vulkan"; then
            cmake --preset ios-vulkan
          else
            cmake -S . -B build/ios-vulkan \
              -G Xcode \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_SYSROOT=iphoneos \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_TOOLCHAIN_FILE="$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=arm64-ios \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""
          fi

      - name: Build Project
        run: |
          if cmake --list-presets 2>/dev/null | grep -q "ios-vulkan"; then
            cmake --build --preset ios-vulkan --config Release -- \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" || \
            cmake --build build/ios-vulkan --config Release -- \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          else
            cmake --build build/ios-vulkan --config Release -- \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          fi

      - name: Package IPA
        run: |
          if [ -f "./scripts/build/ios/package-ios-zh.sh" ]; then
            chmod +x ./scripts/build/ios/package-ios-zh.sh
            ./scripts/build/ios/package-ios-zh.sh || true
          fi

          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | grep -v -i "test" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d 2>/dev/null | grep -v -i "test" | head -n 1)
          fi

          if [ -n "$APP_PATH" ]; then
            echo "Found App Bundle at: $APP_PATH"
            cp -R "$APP_PATH" Payload/
            zip -r Generals.ipa Payload
          else
            echo "Error: No .app bundle found!"
            find build -maxdepth 5 2>/dev/null || true
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Generals-iOS-IPA
          path: Generals.ipa
          if-no-files-found: error
