name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix Submodule SSH URLs & Sync
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Install Host Build Tools
        run: |
          brew update
          brew install cmake ninja meson pkgconf autoconf autoconf-archive automake libtool gperf freetype libpng gettext bison flex

      - name: Setup vcpkg Environment
        run: |
          if [ ! -d "$HOME/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          fi
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV

      - name: Fetch MoltenVK and Stage Fonts
        run: |
          if [ -f "./scripts/build/ios/fetch-moltenvk.sh" ]; then
            chmod +x ./scripts/build/ios/fetch-moltenvk.sh
            ./scripts/build/ios/fetch-moltenvk.sh || true
          fi
          if [ -f "./scripts/build/ios/stage-fonts.sh" ]; then
            chmod +x ./scripts/build/ios/stage-fonts.sh
            ./scripts/build/ios/stage-fonts.sh || true
          fi

      - name: Clean Old Build Artifacts
        run: |
          rm -rf build build-ios Payload Generals.ipa

      - name: Configure CMake for iOS (Ninja Generator)
        run: |
          mkdir -p build-ios
          cmake -S . -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DSAGE_USE_SDL3=ON \
            -DSAGE_USE_OPENAL=ON \
            -DSAGE_USE_GLM=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-ios \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO

      - name: Build iOS Project
        run: |
          cmake --build build-ios --config Release

      - name: Package IPA
        run: |
          if [ -f "./scripts/build/ios/package-ios-zh.sh" ]; then
            chmod +x ./scripts/build/ios/package-ios-zh.sh
            ./scripts/build/ios/package-ios-zh.sh || true
          fi

          mkdir -p Payload
          APP_PATH=$(find build-ios build . -maxdepth 4 -name "*.app" -type d 2>/dev/null | grep -v -i "test" | head -n 1)

          if [ -n "$APP_PATH" ]; then
            echo "Found App Bundle at: $APP_PATH"
            cp -R "$APP_PATH" Payload/
          else
            echo "No .app bundle found. Searching for built binary..."
            BIN_PATH=$(find build-ios build -maxdepth 4 -type f \( -name "Generals*" -o -name "genzh*" -o -name "sage*" \) 2>/dev/null | head -n 1)
            if [ -n "$BIN_PATH" ]; then
              echo "Found executable at: $BIN_PATH"
              mkdir -p Payload/Generals.app
              cp "$BIN_PATH" Payload/Generals.app/Generals
              echo '<?xml version="1.0" encoding="UTF-8"?>' > Payload/Generals.app/Info.plist
              echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> Payload/Generals.app/Info.plist
              echo '<plist version="1.0"><dict>' >> Payload/Generals.app/Info.plist
              echo '<key>CFBundleExecutable</key><string>Generals</string>' >> Payload/Generals.app/Info.plist
              echo '<key>CFBundleIdentifier</key><string>com.generals.mac.ios</string>' >> Payload/Generals.app/Info.plist
              echo '<key>CFBundleName</key><string>Generals</string>' >> Payload/Generals.app/Info.plist
              echo '<key>CFBundlePackageType</key><string>APPL</string>' >> Payload/Generals.app/Info.plist
              echo '<key>CFBundleShortVersionString</key><string>1.0</string>' >> Payload/Generals.app/Info.plist
              echo '<key>CFBundleVersion</key><string>1</string>' >> Payload/Generals.app/Info.plist
              echo '<key>LSRequiresIPhoneOS</key><true/>' >> Payload/Generals.app/Info.plist
              echo '<key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>' >> Payload/Generals.app/Info.plist
              echo '</dict></plist>' >> Payload/Generals.app/Info.plist
            else
              echo "Error: Neither .app bundle nor executable found!"
              find build-ios build -maxdepth 4 2>/dev/null || true
              exit 1
            fi
          fi

          zip -r Generals.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Generals-iOS-IPA
          path: Generals.ipa
          if-no-files-found: error
