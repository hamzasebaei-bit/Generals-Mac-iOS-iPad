name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix Submodule SSH URLs & Sync
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule update --init references/fbraz3-dxvk || true

      - name: Install Host Build Tools
        run: |
          brew update
          brew install cmake ninja meson pkgconf autoconf autoconf-archive automake libtool gperf freetype libpng

      - name: Setup vcpkg Environment
        run: |
          if [ ! -d "$HOME/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          fi
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV

      - name: Fetch MoltenVK and Stage Fonts
        run: |
          if [ -f "./scripts/build/ios/fetch-moltenvk.sh" ]; then
            chmod +x ./scripts/build/ios/fetch-moltenvk.sh
            ./scripts/build/ios/fetch-moltenvk.sh || true
          fi
          if [ -f "./scripts/build/ios/stage-fonts.sh" ]; then
            chmod +x ./scripts/build/ios/stage-fonts.sh
            ./scripts/build/ios/stage-fonts.sh || true
          fi

      - name: Configure CMake for iOS
        run: |
          # Copy presets if CMakeUserPresets.json does not exist
          if [ ! -f "CMakeUserPresets.json" ] && [ -f "CMakePresets.json" ]; then
            cp CMakePresets.json CMakeUserPresets.json
          fi

          if cmake --list-presets 2>/dev/null | grep -q "ios-vulkan"; then
            echo "Using CMake preset: ios-vulkan"
            cmake --preset ios-vulkan \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""
          else
            echo "Preset not found, configuring manually..."
            mkdir -p build-ios
            cmake -S . -B build-ios -G Xcode \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_SYSROOT=iphoneos \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
              -DSAGE_USE_SDL3=ON \
              -DSAGE_USE_OPENAL=ON \
              -DSAGE_USE_GLM=ON \
              -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
              -DCMAKE_TOOLCHAIN_FILE="$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=arm64-ios \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
              -DCMAKE_XCODE_ATTRIBUTE_ENABLE_BITCODE=NO
          fi

      - name: Build iOS Project
        run: |
          if [ -d "build/ios-vulkan" ]; then
            cmake --build build/ios-vulkan --config Release
          elif [ -d "build-ios" ]; then
            cmake --build build-ios --config Release
          else
            cmake --build . --config Release
          fi

      - name: Package IPA
        run: |
          if [ -f "./scripts/build/ios/package-ios-zh.sh" ]; then
            chmod +x ./scripts/build/ios/package-ios-zh.sh
            ./scripts/build/ios/package-ios-zh.sh || true
          fi

          mkdir -p Payload
          APP_PATH=$(find build build-ios . -name "*.app" -type d 2>/dev/null | grep -v -i "test" | head -n 1)

          if [ -n "$APP_PATH" ]; then
            echo "Found App Bundle at: $APP_PATH"
            cp -R "$APP_PATH" Payload/
            zip -r Generals.ipa Payload
          else
            echo "Error: No .app bundle found!"
            find build build-ios -maxdepth 5 2>/dev/null || true
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Generals-iOS-IPA
          path: Generals.ipa
          if-no-files-found: error
